[project]
name = "backend"
version = "0.1.0"
description = "Full-stack starter backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.14",
    "httpx>=0.28.1",
    "mistralai>=1.9.3",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.37.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
